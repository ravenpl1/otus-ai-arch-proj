---
# Authelia 4.37 Configuration for RFSD RAG Agent

theme: dark

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

totp:
  disable: false
  issuer: rfsd-rag.local

webauthn:
  disable: true

# JWT secret (patched by entrypoint.sh)
jwt_secret: JWT_SECRET_PLACEHOLDER

# The authentication backend
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

# Session — patched by entrypoint.sh
session:
  name: authelia_session
  secret: SESSION_SECRET_PLACEHOLDER
  domain: AUTH_HOST_PLACEHOLDER
  expiration: 3600
  inactivity: 300

# Storage
storage:
  encryption_key: 'rfsd-rag-agent-storage-encryption-key-change-me'
  local:
    path: /config/db.sqlite3

# Notifier
notifier:
  filesystem:
    filename: /config/notification.txt

# Access control
access_control:
  default_policy: one_factor
  rules: []

# OIDC Identity Provider
identity_providers:
  oidc:
    # OIDC signing key (generated by entrypoint.sh via authelia crypto pair generate)
    issuer_private_key: OIDC_KEY_PLACEHOLDER
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
      allowed_origins:
        - "http://AUTH_HOST_PLACEHOLDER:3000"
        - "http://AUTH_HOST_PLACEHOLDER:8000"
        - "http://localhost:3000"
        - "http://localhost:8000"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:8000"
        - "http://BACKEND_HOST_PLACEHOLDER:3000"
        - "http://BACKEND_HOST_PLACEHOLDER:8000"
      allowed_origins_from_client_redirect_uris: true

    clients:
      - id: fastapi-swagger
        description: RFSD RAG Agent — Swagger UI
        public: true
        authorization_policy: one_factor
        redirect_uris:
          - "http://AUTH_HOST_PLACEHOLDER:8000/docs/oauth2-redirect"
          - "http://AUTH_HOST_PLACEHOLDER:8000/redoc"
          - "http://localhost:8000/docs/oauth2-redirect"
          - "http://localhost:8000/redoc"
          - "http://127.0.0.1:8000/docs/oauth2-redirect"
          - "http://127.0.0.1:8000/redoc"
          - "http://BACKEND_HOST_PLACEHOLDER:8000/docs/oauth2-redirect"
          - "http://BACKEND_HOST_PLACEHOLDER:8000/redoc"
        scopes:
          - openid
          - profile
          - groups
          - email
        grant_types:
          - authorization_code
        response_types:
          - code

      - id: frontend-spa
        description: RFSD RAG Agent — Frontend SPA
        public: true
        authorization_policy: one_factor
        redirect_uris:
          - "http://AUTH_HOST_PLACEHOLDER:3000/callback"
          - "http://AUTH_HOST_PLACEHOLDER:3000"
          - "http://localhost:3000/callback"
          - "http://localhost:3000"
          - "http://127.0.0.1:3000/callback"
          - "http://127.0.0.1:3000"
          - "http://BACKEND_HOST_PLACEHOLDER:3000/callback"
          - "http://BACKEND_HOST_PLACEHOLDER:3000"
        scopes:
          - openid
          - profile
          - groups
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
